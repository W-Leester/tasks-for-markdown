name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:packages
      - name: Integration tests (VS Code)
        # One retry: the headless VS Code window occasionally hangs at startup on the runner ("CodeWindow: detected unresponsive").
        run: xvfb-run -a pnpm test:integration || (echo 'Integration tests failed; retrying once' && xvfb-run -a pnpm test:integration)
