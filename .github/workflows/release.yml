name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Integration tests (VS Code)
        run: xvfb-run -a pnpm test:integration
      - name: Package .vsix + latest.json
        run: pnpm package
      - name: Build and pack npm packages (.tgz attached to the release)
        run: |
          pnpm build:packages
          pnpm --filter @hastycapybara/tasks-core pack --pack-destination .
          pnpm --filter @hastycapybara/tasks-cli pack --pack-destination .
      - name: GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
            *.tgz
            dist/latest.json
          generate_release_notes: true
      # Publishing runs only when the tokens are configured as repository secrets.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --no-dependencies --packagePath *.vsix
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx publish *.vsix -p "$OVSX_PAT"
