name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Trusted publishing (npm, Open VSX): GitHub issues a short-lived OIDC token the registries accept instead of a stored token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Tokens at job level: a step's own `env` is not visible to that step's `if`.
    # OVSX_PAT is deliberately not here: ovsx prefers OVSX_PAT over trusted publishing.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Integration tests (VS Code)
        # One retry: the headless VS Code window occasionally hangs at startup on the runner ("CodeWindow: detected unresponsive").
        run: xvfb-run -a pnpm test:integration || (echo 'Integration tests failed; retrying once' && xvfb-run -a pnpm test:integration)
      - name: Package .vsix + latest.json
        run: pnpm package
      - name: Build and pack npm packages (.tgz attached to the release)
        run: |
          pnpm build:packages
          pnpm --filter @hastycapybara/tasks-core pack --pack-destination .
          pnpm --filter @hastycapybara/tasks-cli pack --pack-destination .
          pnpm --filter @hastycapybara/tasks-api pack --pack-destination .
      - name: GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
            *.tgz
            dist/latest.json
          generate_release_notes: true
      # Publishing runs only when the tokens are configured as repository secrets.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: pnpm exec vsce publish --no-dependencies --packagePath *.vsix
      # Trusted publishing (OIDC, ovsx >= 1.2.0) first; the OVSX_PAT secret is only a fallback until it is confirmed.
      - name: Publish to Open VSX
        env:
          FALLBACK_OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if ! pnpm exec ovsx publish *.vsix --trusted-publishing; then
            if [ -z "$FALLBACK_OVSX_PAT" ]; then exit 1; fi
            echo "::warning::Open VSX trusted publishing failed; publishing with the OVSX_PAT secret"
            pnpm exec ovsx publish *.vsix -p "$FALLBACK_OVSX_PAT"
          fi
      # npm trusted publishing (OIDC); no token since 1.1.0 (2026-10-09).
      - name: Publish npm packages
        run: |
          for pkg in tasks-core tasks-cli tasks-api; do
            pnpm --filter "@hastycapybara/${pkg}" publish --access public --no-git-checks
          done
