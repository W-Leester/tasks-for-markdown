name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # npm trusted publishing: GitHub issues a short-lived OIDC token that npm accepts instead of NPM_TOKEN.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Tokens at job level: a step's own `env` is not visible to that step's `if`.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Integration tests (VS Code)
        # One retry: the headless VS Code window occasionally hangs at startup on the runner ("CodeWindow: detected unresponsive").
        run: xvfb-run -a pnpm test:integration || (echo 'Integration tests failed; retrying once' && xvfb-run -a pnpm test:integration)
      - name: Package .vsix + latest.json
        run: pnpm package
      - name: Build and pack npm packages (.tgz attached to the release)
        run: |
          pnpm build:packages
          pnpm --filter @hastycapybara/tasks-core pack --pack-destination .
          pnpm --filter @hastycapybara/tasks-cli pack --pack-destination .
          pnpm --filter @hastycapybara/tasks-api pack --pack-destination .
      - name: GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
            *.tgz
            dist/latest.json
          generate_release_notes: true
      # Publishing runs only when the tokens are configured as repository secrets.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: pnpm exec vsce publish --no-dependencies --packagePath *.vsix
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: pnpm exec ovsx publish *.vsix -p "$OVSX_PAT"
      # Trusted publishing (OIDC) first; NPM_TOKEN is only a fallback until the switch is confirmed.
      - name: Publish npm packages
        run: |
          if [ -n "${NPM_TOKEN}" ]; then echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc; fi
          for pkg in tasks-core tasks-cli tasks-api; do
            pnpm --filter "@hastycapybara/${pkg}" publish --access public --no-git-checks
          done
