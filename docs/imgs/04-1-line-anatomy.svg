<text x="20" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="normal">쓰기: description → priority → recurrence → 🏁 onCompletion → 🆔 id → ⛔ dependsOn → ➕ created → 🛫 start → ⏳ scheduled → 📅 due → ✅ done → ❌ cancelled → blockLink</text>
<text x="20" y="305" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">Dataview 포맷도 동일 구조:  - [ ] 보고서 작성 #work [priority:: high] [repeat:: every week] [start:: 2026-09-20] [scheduled:: 2026-09-22] [due:: 2026-09-25] [id:: a1b2c3]</text>
<text x="20" y="340" font-family="'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#0066b8" text-anchor="start" font-weight="normal">Task는 불변(immutable) — 변경은 새 Task를 만들어 직렬화 → 파일 쓰기 → 변경 이벤트로 재파싱</text>
